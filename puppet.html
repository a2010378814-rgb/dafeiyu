<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2D 动画预览</title>
  <style>
    :root { --panel: #f3f1ee; --text: #2b2b2b; }
    html, body { margin: 0; height: 100%; background: #ffffff; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    body.dark { background: #22232a; }
    #c { display: block; width: 100vw; height: 100vh; }
    #ui { position: fixed; left: 8px; top: 8px; background: var(--panel); padding: 8px 10px; border-radius: 8px; width: 230px; }
    #ui label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #ui label span { width: 52px; }
    #ui input[type=range] { flex: 1; }
    #ui.hidden { display: none; }
    #actions { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    #actions button { font: inherit; padding: 2px 8px; border: 1px solid #c9c4bd; border-radius: 6px; background: #fff; cursor: pointer; }
    #actions button:hover { background: #ece8e2; }
    .tip { margin: 4px 0; color: #777; font-size: 12px; }
    #c { touch-action: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <label><input type="checkbox" id="auto" checked /> 自动待机（跟随鼠标）</label>
    <label><input type="checkbox" id="talk" /> 说话</label>
    <label><span>朝向</span><select id="facing">
      <option value="front">正面</option><option value="left">朝左</option>
      <option value="right">朝右</option><option value="back">背面</option>
    </select></label>
    <label><input type="checkbox" id="walk" /> 走路（← → 键也可以）</label>
    <label><input type="checkbox" id="free" /> 自由活动（自己走动、做动作）</label>
    <div id="actions"></div>
    <p class="tip">按住人物拖动 = 拎起来；在头上来回划 = 摸头；点一下 = 打招呼。不同层的动作可以同时点，会叠加。</p>
    <p class="tip"><a href="motion-editor.html" target="_blank">打开动作编辑器</a>（改完保存后刷新本页生效）</p>
    <div id="sliders"></div>
  </div>
  <script type="module" src="/src/puppet/preview.js"></script>
</body>
</html>
